{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Reg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="index">
    <div class="container py-1">
        <div class="row justify-content-center">
            <div class="text-center">
                <img src="{% static 'images/logo.png' %}" alt="Game Store Logo" class="img-fluid w-50">
            </div>
            <!-- Register Form -->
            <div class="col-md-6 mb-2 mt-0 ">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">Create Account</div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="register">

                            <div class="mb-3">
                                <label for="username" class="form-label">User Name</label>
                                <input type="text" name="username" class="form-control" placeholder="Username">
                            </div>

                            <div class="mb-3">
                                <label for="firstname" class="form-label">First Name</label>
                                <input type="text" name="firstname" class="form-control" placeholder="First Name">
                            </div>

                            <div class="mb-3">
                                <label for="lastname" class="form-label">Last Name</label>
                                <input type="text" name="lastname" class="form-control" placeholder="Last Name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="Email">
                            </div>

                            <div class="mb-3">
                                <label for="phonenumber" class="form-label">Phone Number</label>
                                <input type="text" name="phone_number" class="form-control" placeholder="05xxxxxxxx">
                            </div>

                            <div class="mb-3">
                                <label for="date_of_birth" class="form-label">Date of Birth</label>
                                <input type="date" name="date_of_birth" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Password">
                            </div>

                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control"
                                    placeholder="Confirm Password">
                            </div>

                            <div class="mb-3">
                                <label for="avatar" class="form-label">Avatar</label>
                                <input type="file" name="avatar" class="form-control">
                            </div>

                            <button type="submit" class="btn btn-success w-100">Create Account</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <div class="col-md-4 mb-4 mt-0 pt-0">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">Sign In</div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="login">

                            <div class="mb-3">
                                <label for="login_email" class="form-label">Email</label>
                                <input type="email" name="login_email" class="form-control" placeholder="Email">
                            </div>

                            <div class="mb-3">
                                <label for="login_password" class="form-label">Password</label>
                                <input type="password" name="login_password" class="form-control"
                                    placeholder="Password">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Sign In</button>
                        </form>
                    </div>
                </div>
                <!-- Messages -->
                <div class="col mt-3">
                    {% if messages %}
                    <div class="col justify-content-center">
                        {% for message in messages %}
                        <div class="row-md-8 mb-2">
                            <div class="card shadow-sm border-{{ message.tags }}">
                                <div class="card-body">
                                    <h6 class="card-title text-capitalize">{{ message.tags }}</h6>
                                    <p class="card-text">{{ message }}</p>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>

</html>
